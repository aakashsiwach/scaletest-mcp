[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scaletest-mcp"
version = "0.1.0"
description = "Local-first MCP server for controlled HTTP load testing and scaling experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0", "httpx>=0.27.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
kubernetes = ["kubernetes>=30.0"]

[project.scripts]
scaletest = "scaletest_mcp.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scaletest_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"