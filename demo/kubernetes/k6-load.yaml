apiVersion: v1
kind: ConfigMap
metadata:
  name: scaletest-k6-script
  namespace: scaletest-demo
data:
  load.js: |
    import http from "k6/http";
    import { check, sleep } from "k6";

    export const options = {
      scenarios: {
        local_hpa_demo: {
          executor: "constant-vus",
          vus: 20,
          duration: "120s",
          gracefulStop: "5s",
        },
      },
    };

    export default function () {
      const response = http.get("http://scaletest-demo.scaletest-demo.svc.cluster.local:8080/?work_ms=80", {
        timeout: "5s",
        redirects: 0,
      });
      check(response, { "HTTP 200": (r) => r.status === 200 });
      sleep(0.1);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: scaletest-k6-load
  namespace: scaletest-demo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: scaletest-k6-load
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          args: ["run", "/scripts/load.js"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: script
          configMap:
            name: scaletest-k6-script